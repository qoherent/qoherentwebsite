<footer
  class="border-t border-border bg-body dark:border-darkmode-border dark:bg-darkmode-body">
  <div class="container">
    <div class="row items-center py-12 md:py-16">
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:text-left">
        <!-- navbar brand/logo -->
        <a
          class="navbar-brand inline-block"
          href="{{ site.Home.RelPermalink }}">
          {{ partial "logo" }}™
        </a>
        <div class="mt-3 max-w-[28ch] text-sm text-light dark:text-darkmode-light">
          Let's build intelligent radios together.
        </div>
      </div>
      <div class="lg:col-6 mb-8 lg:text-left lg:mb-0 text-center">
        <ul
          class="flex flex-wrap justify-center gap-x-6 gap-y-3 lg:justify-start">
          {{ range site.Menus.footer }}
            <li>
              <a
                class="text-sm font-medium text-dark hover:text-primary dark:text-darkmode-text dark:hover:text-darkmode-primary"
                {{ if findRE `^http` .URL }}
                  target="_blank" rel="noopener"
                {{ end }}
                href="{{ if findRE `^#` .URL }}
                  {{ if not $.IsHome }}
                    {{ site.Home.RelPermalink }}
                  {{ end }}{{ .URL }}
                {{ else }}
                  {{ .URL | relLangURL }}
                {{ end }}"
                >{{ .Name }}</a>
            </li>
          {{ end }}
        </ul>
      </div>
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:mt-0 lg:text-right">
        <ul class="social-icons justify-center lg:justify-end">
          {{ range hugo.Data.social.main }}
            <li>
              <a
                target="_blank"
                aria-label="{{ .name }}"
                rel="nofollow noopener"
                href="{{ .link | safeURL }}">
                <i class="{{ .icon }}"></i>
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
  {{/*<div class="border-border dark:border-darkmode-border border-t py-7">
    <div class="text-light dark:text-darkmode-light container text-center">
      <p>
        {{ site.Params.copyright | markdownify }}
      </p>
    </div>
  </div>*/}}
</footer>
