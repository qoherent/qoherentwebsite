<button id="progress" type="button" aria-label="Back to top">
  <span class="top" id="progress-value" aria-hidden="true"
    ><strong>^</strong></span
  >
</button>

<style>
  #progress {
    position: fixed;
    right: 50px;
    bottom: 50px;
    z-index: 1000;
    display: none;
    width: 65px;
    height: 65px;
    padding: 0;
    cursor: pointer;
    border: 0;
    box-shadow: 0 0 8.5px rgba(0, 0, 0, 0.15);
  }

  #progress-value {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    display: block;
    width: calc(100% - 15px);
    height: calc(100% - 15px);
    color: #717171;
    font-size: 40px;
    line-height: 60px;
    background-color: #1c1c1c;
    transform: translate(-50%, -50%);
  }

  @media (max-width: 1250px) {
    #progress {
      right: 30px;
      bottom: 30px;
      width: 50px;
      height: 50px;
    }
    #progress-value {
      font-size: 25px;
      line-height: 40px;
    }
  }

  @media (max-width: 400px) {
    #progress {
      right: 25px;
      bottom: 25px;
      width: 40px;
      height: 40px;
    }
    #progress-value {
      width: calc(100% - 10px);
      height: calc(100% - 10px);
      font-size: 20px;
      line-height: 35px;
    }
  }
</style>

<script>
  (() => {
    const progress = document.querySelector("#progress");
    const prefersReducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)",
    );

    const updateProgress = () => {
      const scrollRange =
        document.documentElement.scrollHeight -
        document.documentElement.clientHeight;
      const percentage =
        scrollRange > 0
          ? Math.round((document.documentElement.scrollTop * 100) / scrollRange)
          : 0;
      progress.style.display =
        document.documentElement.scrollTop > 50 ? "grid" : "none";
      progress.style.background = `conic-gradient(#884da0 ${percentage}%, #d7d7d7 ${percentage}%)`;
    };

    progress?.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: prefersReducedMotion.matches ? "auto" : "smooth",
      });
    });
    window.addEventListener("scroll", updateProgress, { passive: true });
    updateProgress();
  })();
</script>
