{{ define "main" }}
  {{ partial "page-header" (dict "Title" .Params.title) }}
  {{ partial "progress_indicator" }}


  <section class="section-sm">
    <div class="container">
      <div class="row">
        <div class="content text-center">{{ .Content }}</div>
        <div class="mx-auto md:col-10 lg:col-6">
          <form
            action="{{ site.Params.contact_form_action }}"
            method="POST"
            data-contact-form>
            <div class="mb-6">
              <label for="name" class="form-label"
                >Full name
                <span class="text-red-500" aria-hidden="true">*</span></label
              >
              <input
                id="name"
                name="name"
                class="form-input"
                type="text"
                autocomplete="name"
                required />
            </div>
            <div class="mb-6">
              <label for="email" class="form-label"
                >Email address
                <span class="text-red-500" aria-hidden="true">*</span></label
              >
              <input
                id="email"
                name="email"
                class="form-input"
                type="email"
                autocomplete="email"
                required />
            </div>
            <div class="mb-6">
              <label for="message" class="form-label"
                >Message
                <span class="text-red-500" aria-hidden="true">*</span></label
              >
              <textarea
                id="message"
                name="message"
                class="form-input"
                rows="8"
                required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
            <p class="mt-4 text-sm">
              We use your information to respond to this inquiry. See our
              <a href="{{ `privacy-policy/` | relLangURL }}">privacy policy</a>.
            </p>
            <p
              class="mt-3"
              role="status"
              aria-live="polite"
              data-form-status></p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const form = document.querySelector("[data-contact-form]");
      const status = form?.querySelector("[data-form-status]");
      const submit = form?.querySelector("button[type='submit']");

      form?.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        status.textContent = "Sending your message...";

        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { Accept: "application/json" },
          });

          if (!response.ok)
            throw new Error(
              `Form submission failed with status ${response.status}`,
            );

          form.reset();
          status.textContent = "Thank you. Your message has been sent.";
        } catch (error) {
          console.error(error);
          status.textContent =
            "We could not send your message. Please try again or email us directly.";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
{{ end }}
